<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="UX/UI 포트폴리오 24주 학습 관리 앱">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UI Study Path">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>UI Study Path · 24주 포트폴리오 플래너</title>
<style>html{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{margin:0;background:#f6f8fc}#loading{display:grid;place-items:center;min-height:80vh;color:#465368;padding:24px;text-align:center}</style>
<script src="./config.js"></script>
</head>
<body><div id="loading">UI Study Path를 불러오는 중…</div>
<script type="module">
try {
  const r=await fetch('./payload.txt',{cache:'no-cache'});
  if(!r.ok)throw Error('학습 데이터 파일을 불러오지 못했어요.');
  const b64=(await r.text()).trim();
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const json=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const pack=JSON.parse(json);
  const css=document.createElement('style');css.textContent=pack.css;document.head.appendChild(css);
  document.body.innerHTML=pack.body;
  const originalFetch=window.fetch.bind(window);
  window.fetch=(input,opts)=>{
    const url=typeof input==='string'?input:input?.url||'';
    if(url==='./data/plan.json'||url.endsWith('/data/plan.json'))
      return Promise.resolve(new Response(JSON.stringify(pack.plan),{status:200,headers:{'Content-Type':'application/json'}}));
    return originalFetch(input,opts);
  };
  const blobUrl=URL.createObjectURL(new Blob([pack.js],{type:'text/javascript'}));
  const script=document.createElement('script');script.type='module';script.src=blobUrl;
  script.addEventListener('load',()=>URL.revokeObjectURL(blobUrl));
  document.body.appendChild(script);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}catch(error){
  document.querySelector('#loading').textContent='앱을 여는 중 문제가 발생했어요: '+error.message;
}
</script></body></html>
